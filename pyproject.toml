[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmp-raiox"
version = "0.1.0"
description = "Raio-X tecnico do PPA 2026-2029 por Unidade Gestora"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
